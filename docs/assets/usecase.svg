<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <style>
      .title { font: 700 26px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill:#172b4d; }
      .label { font: 18px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill:#172b4d; }
      .uc { font: 18px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill:#172b4d; text-anchor:middle; dominant-baseline:middle; }
      .edge { stroke:#42526e; stroke-width:2; fill:none; }
    </style>
  </defs>
  <text x="490" y="42" text-anchor="middle" class="title">校园物联网设备报修系统用例图</text>

  <rect x="285" y="85" width="410" height="400" rx="12" fill="#f7f9fc" stroke="#42526e" stroke-width="2"/>
  <text x="490" y="118" text-anchor="middle" class="label">校园物联网设备报修系统</text>

  <ellipse cx="490" cy="175" rx="120" ry="42" fill="#e9f2ff" stroke="#0052cc" stroke-width="2"/>
  <text x="490" y="175" class="uc">查看设备信息</text>

  <ellipse cx="490" cy="285" rx="120" ry="42" fill="#e9f2ff" stroke="#0052cc" stroke-width="2"/>
  <text x="490" y="285" class="uc">提交报修</text>

  <ellipse cx="490" cy="395" rx="120" ry="42" fill="#e9f2ff" stroke="#0052cc" stroke-width="2"/>
  <text x="490" y="395" class="uc">更新工单状态</text>

  <!-- 报修人 actor -->
  <circle cx="105" cy="180" r="20" fill="none" stroke="#172b4d" stroke-width="3"/>
  <line x1="105" y1="200" x2="105" y2="285" stroke="#172b4d" stroke-width="3"/>
  <line x1="65" y1="232" x2="145" y2="232" stroke="#172b4d" stroke-width="3"/>
  <line x1="105" y1="285" x2="70" y2="345" stroke="#172b4d" stroke-width="3"/>
  <line x1="105" y1="285" x2="140" y2="345" stroke="#172b4d" stroke-width="3"/>
  <text x="105" y="375" text-anchor="middle" class="label">报修人</text>

  <!-- 维修人员 actor -->
  <circle cx="875" cy="180" r="20" fill="none" stroke="#172b4d" stroke-width="3"/>
  <line x1="875" y1="200" x2="875" y2="285" stroke="#172b4d" stroke-width="3"/>
  <line x1="835" y1="232" x2="915" y2="232" stroke="#172b4d" stroke-width="3"/>
  <line x1="875" y1="285" x2="840" y2="345" stroke="#172b4d" stroke-width="3"/>
  <line x1="875" y1="285" x2="910" y2="345" stroke="#172b4d" stroke-width="3"/>
  <text x="875" y="375" text-anchor="middle" class="label">维修人员</text>

  <!-- Reporter associations -->
  <line x1="145" y1="220" x2="370" y2="175" class="edge"/>
  <line x1="145" y1="235" x2="370" y2="285" class="edge"/>

  <!-- Maintainer associations -->
  <line x1="835" y1="220" x2="610" y2="175" class="edge"/>
  <line x1="835" y1="235" x2="610" y2="395" class="edge"/>
</svg>
